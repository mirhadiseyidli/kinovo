# Rate limiting zones - define outside server blocks
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=ai:10m rate=1r/s;
limit_req_zone $binary_remote_addr zone=search:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=static:10m rate=30r/s;

# Connection limiting
limit_conn_zone $binary_remote_addr zone=addr:10m;

# Define upstream servers (load balancing pool)
upstream kinovo_backend {
    # Load balancing method (default is round-robin)
    # Options: least_conn, ip_hash, random
    least_conn;
    
    # Backend servers (add more as you scale)
    server localhost:5002 weight=1 max_fails=3 fail_timeout=30s;
    server localhost:5003 weight=1 max_fails=3 fail_timeout=30s;
    server localhost:5004 weight=1 max_fails=3 fail_timeout=30s;
    
    # Keep alive connections for better performance
    keepalive 32;
}

server {
    server_name kinovo.app www.kinovo.app;

    # Root directory for static files
    root /var/www/html;
    
    # Connection limit per IP
    limit_conn addr 20;

    # Handle Let's Encrypt challenge (no rate limiting for cert renewal)
    location /.well-known/acme-challenge/ {
        allow all;
        try_files $uri =404;
    }
    
    # Health check endpoint (no rate limiting for monitoring)
    location /api/health {
        proxy_pass http://kinovo_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Keep alive settings
        proxy_set_header Connection "";
        
        access_log off;
    }
    
    # Authentication endpoints - strict rate limiting
    location ~ ^/api/auth {
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;
        
        proxy_pass http://kinovo_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Session affinity for auth (optional)
        # proxy_set_header Cookie $http_cookie;
    }
    
    # AI and vector search endpoints - expensive operations
    location ~ ^/api/(ai|vector-search) {
        limit_req zone=ai burst=3 nodelay;
        limit_req_status 429;
        
        proxy_pass http://kinovo_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Search endpoints
    location ~ ^/api/search {
        limit_req zone=search burst=10 nodelay;
        limit_req_status 429;
        
        proxy_pass http://kinovo_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy all other requests to Node.js (with general rate limiting)
    location / {
        limit_req zone=general burst=20 nodelay;
        limit_req_status 429;
        
        proxy_pass http://kinovo_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts for long-running requests
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # iOS universal link file
    location = /.well-known/apple-app-site-association {
        limit_req zone=static burst=10 nodelay;
        default_type application/json;
        gzip off;
        try_files $uri =404;
    }

    # Friendly fallback for users who don't have the app
    location = /invite {
        limit_req zone=static burst=10 nodelay;
        
        set $is_ios 0;
        set $is_android 0;

        if ($http_user_agent ~* "(iPhone|iPad|iPod)")   { set $is_ios 1; }
        if ($http_user_agent ~* "Android")             { set $is_android 1; }

        if ($is_ios) {
            return 302 https://apps.apple.com/app/6746650733;
        }

        if ($is_android) {
            return 302 https://play.google.com/store/apps/details?id=com.kinovoapp.kinovo;
        }

        root /var/www/html;
        try_files /landing.html =404;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/kinovo.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kinovo.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# HTTP to HTTPS redirect
server {
    if ($host = www.kinovo.app) {
        return 301 https://$host$request_uri;
    }

    if ($host = kinovo.app) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name kinovo.app www.kinovo.app;
    return 404;
}